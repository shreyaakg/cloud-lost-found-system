services:
  - type: web
    name: lostfound-cloud
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
        sync: false
      - key: RENDER
        value: true
      - key: PYTHON_VERSION
        value: 3.11.9
      # DATABASE_URL is intentionally omitted here.
      # Attach a Render PostgreSQL database to this service in the Render
      # dashboard — Render will inject DATABASE_URL automatically.
      # S3 — set these manually in the Render dashboard after creating the bucket
      - key: AWS_ACCESS_KEY_ID
        value: ""
      - key: AWS_SECRET_ACCESS_KEY
        value: ""
      - key: AWS_REGION
        value: ap-southeast-1
      - key: S3_BUCKET_NAME
        value: ""
